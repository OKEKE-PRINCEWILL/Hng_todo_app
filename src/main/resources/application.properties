spring.application.name=simple-todo

# PostgreSQL is used in development and production. Override these values with
# environment variables in deployed environments.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/todo}
spring.datasource.username=${DATABASE_USERNAME:todo}
spring.datasource.password=${DATABASE_PASSWORD:todo}
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DATABASE_VALIDATION_TIMEOUT_MS:5000}

# Flyway owns the schema; Hibernate verifies that the entities match it.
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Render can use this endpoint without exposing application data.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
